<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生命の樹＋ — 22のパス</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;
  --surface:#111118;
  --surface2:#1a1a24;
  --border:rgba(180,160,255,0.15);
  --accent:#a78bfa;
  --accent2:#e879f9;
  --gold:#f5c842;
  --text:#e8e4f0;
  --text2:#9991b0;
  --glow:rgba(167,139,250,0.2);
  --node-size:48px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Serif JP',serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:
  radial-gradient(1px 1px at 15% 25%,rgba(255,255,255,.4) 0%,transparent 100%),
  radial-gradient(1px 1px at 55% 8%,rgba(255,255,255,.3) 0%,transparent 100%),
  radial-gradient(1px 1px at 78% 45%,rgba(255,255,255,.35) 0%,transparent 100%),
  radial-gradient(1px 1px at 35% 65%,rgba(255,255,255,.3) 0%,transparent 100%),
  radial-gradient(1px 1px at 88% 18%,rgba(255,255,255,.4) 0%,transparent 100%),
  radial-gradient(1px 1px at 50% 88%,rgba(255,255,255,.3) 0%,transparent 100%),
  radial-gradient(1px 1px at 65% 72%,rgba(255,255,255,.35) 0%,transparent 100%),
  radial-gradient(1px 1px at 22% 48%,rgba(255,255,255,.25) 0%,transparent 100%),
  radial-gradient(1px 1px at 92% 60%,rgba(255,255,255,.3) 0%,transparent 100%),
  radial-gradient(1px 1px at 8% 82%,rgba(255,255,255,.25) 0%,transparent 100%);
  pointer-events:none;z-index:0}
.container{max-width:980px;margin:0 auto;padding:30px 24px 80px;position:relative;z-index:1}
header{text-align:center;padding:36px 0 28px}
.title-en{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.4em;color:var(--accent);text-transform:uppercase;margin-bottom:12px;opacity:.8}
h1{font-family:'Cinzel',serif;font-size:clamp(24px,4vw,36px);font-weight:600;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 50%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.1em;margin-bottom:10px}
.subtitle{font-size:13px;color:var(--text2);letter-spacing:.15em;margin-bottom:8px}
.back-link{display:inline-block;margin-top:16px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.2em;color:var(--text2);text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.15);padding-bottom:2px;transition:color .2s,border-color .2s}
.back-link:hover{color:var(--text);border-color:rgba(255,255,255,0.4)}

/* 生命の樹SVGラッパー */
.tree-wrap{
  display:flex;
  justify-content:center;
  margin:40px auto;
  max-width:520px;
  position:relative;
}
.tree-svg{width:100%;height:auto;overflow:visible}

/* ノード */
.sephira{cursor:default}
.sephira circle{transition:filter .3s}
.sephira text{pointer-events:none;font-family:'Cinzel',serif}

/* パスライン */
.path-line{
  cursor:pointer;
  stroke-width:6;
  stroke-linecap:round;
  transition:stroke .2s,stroke-width .2s,filter .2s;
  opacity:0.55;
}
.path-line:hover{stroke-width:9;opacity:1;filter:drop-shadow(0 0 6px currentColor)}
.path-line.active{stroke-width:9;opacity:1;filter:drop-shadow(0 0 8px currentColor)}

/* パスラベル（ヘブライ文字） */
.path-label{
  cursor:pointer;
  font-family:'Cinzel',serif;
  font-size:11px;
  fill:rgba(255,255,255,0.5);
  pointer-events:none;
  transition:fill .2s;
}
.path-label.active{fill:rgba(255,255,255,0.95)}

/* 詳細パネル */
.detail-panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:0;
  margin-top:8px;
  overflow:hidden;
  box-shadow:0 0 40px var(--glow);
  display:none;
}
.detail-panel.show{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.panel-header{
  padding:24px 28px 20px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(135deg,rgba(167,139,250,0.05),rgba(232,121,249,0.03));
}
.panel-path-name{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.35em;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:8px;
  opacity:.8;
}
.panel-title{
  font-size:20px;
  color:var(--text);
  letter-spacing:.08em;
  margin-bottom:6px;
}
.panel-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
.meta-tag{
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.15em;
  padding:4px 12px;
  border-radius:20px;
  border:1px solid;
}
.meta-planet{border-color:rgba(167,139,250,0.4);color:#c4b5fd;background:rgba(167,139,250,0.08)}
.meta-hebrew{border-color:rgba(245,200,66,0.4);color:#f5c842;background:rgba(245,200,66,0.06)}
.meta-tarot{border-color:rgba(232,121,249,0.4);color:#f0abfc;background:rgba(232,121,249,0.06)}

.panel-body{padding:24px 28px}

.section-label{
  font-family:'Cinzel',serif;
  font-size:9px;
  letter-spacing:.35em;
  text-transform:uppercase;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
}
.section-label::after{content:'';flex:1;height:1px;background:currentColor;opacity:.2}

.in-section .section-label{color:#f0a080}
.yo-section .section-label{color:#a0d4a0}
.summary-section .section-label{color:var(--text2)}

.section-text{
  font-size:14px;
  line-height:2;
  letter-spacing:.05em;
  color:#c4bdd8;
  margin-bottom:24px;
}
.in-section .section-text{color:#e8cfc0}
.yo-section .section-text{color:#c0e0c0}

.close-btn{
  display:block;
  width:100%;
  padding:14px;
  background:transparent;
  border:none;
  border-top:1px solid var(--border);
  color:var(--text2);
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.2em;
  cursor:pointer;
  transition:background .2s,color .2s;
}
.close-btn:hover{background:rgba(255,255,255,0.03);color:var(--text)}

/* 凡例 */
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  justify-content:center;
  margin-bottom:32px;
}
.legend-item{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--text2);
  letter-spacing:.08em;
}
.legend-line{width:24px;height:3px;border-radius:2px}

/* パス一覧（モバイル補助） */
.path-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:40px;
}
@media(max-width:600px){.path-list{grid-template-columns:1fr}}
.path-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px;
  cursor:pointer;
  transition:border-color .2s,box-shadow .2s;
}
.path-card:hover{border-color:rgba(167,139,250,0.4);box-shadow:0 0 16px rgba(167,139,250,0.08)}
.path-card.active{border-color:var(--accent);box-shadow:0 0 20px rgba(167,139,250,0.15)}
.pc-name{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;color:var(--accent);margin-bottom:4px}
.pc-title{font-size:13px;color:var(--text);letter-spacing:.04em;margin-bottom:4px}
.pc-meta{font-size:11px;color:var(--text2)}

.section-title{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.3em;
  color:var(--text2);
  text-align:center;
  margin:40px 0 20px;
  text-transform:uppercase;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="title-en">Tree of Life — 22 Paths</div>
    <h1>生命の樹＋</h1>
    <div class="subtitle">22のパスで、星と星の間を渡る</div>
    <a href="index.html" class="back-link">← 超数秘術に戻る</a>
  </header>

  <!-- 凡例 -->
  <div class="legend">
    <div class="legend-item"><div class="legend-line" style="background:#9b7fe8"></div>冥王星系</div>
    <div class="legend-item"><div class="legend-line" style="background:#7bafd4"></div>海王星系</div>
    <div class="legend-item"><div class="legend-line" style="background:#64b5c8"></div>天王星系</div>
    <div class="legend-item"><div class="legend-line" style="background:#8fbc8f"></div>木星系</div>
    <div class="legend-item"><div class="legend-line" style="background:#e08050"></div>火星系</div>
    <div class="legend-item"><div class="legend-line" style="background:#f5c842"></div>太陽系</div>
    <div class="legend-item"><div class="legend-line" style="background:#e879f9"></div>金星系</div>
    <div class="legend-item"><div class="legend-line" style="background:#a0c8e8"></div>水星系</div>
    <div class="legend-item"><div class="legend-line" style="background:#c0b8e8"></div>月系</div>
  </div>

  <!-- 生命の樹SVG -->
  <div class="tree-wrap">
    <svg class="tree-svg" viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg" id="tree-svg">
      <defs>
        <!-- セフィロトのグロー -->
        <filter id="glow-keter"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="glow-node"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>

      <!--
        正しい生命の樹の座標:
        ケテル    (冥王星) : 200, 40
        コクマー  (海王星) : 310, 130
        ビナー    (天王星) :  90, 130
        ダアト    (土星)   : 200, 210  ※隠れたセフィラ
        ケセド    (木星)   : 310, 310
        ゲブラー  (火星)   :  90, 310
        ティファレト(太陽) : 200, 390  ※中央・一段下
        ネツァク  (金星)   : 310, 480
        ホド      (水星)   :  90, 480
        イェソド  (月)     : 200, 560
        マルクト  (地球)   : 200, 650
      -->

      <!-- ===== パスライン (背面) ===== -->
      <!-- アレフ: ケテル↔コクマー -->
      <line class="path-line" id="path-alef" x1="200" y1="40" x2="310" y2="130" stroke="#9b7fe8" data-path="alef"/>
      <!-- ベート: ケテル↔ビナー -->
      <line class="path-line" id="path-bet" x1="200" y1="40" x2="90" y2="130" stroke="#9b7fe8" data-path="bet"/>
      <!-- ギーメル: ケテル↔ティファレト -->
      <line class="path-line" id="path-gimel" x1="200" y1="40" x2="200" y2="390" stroke="#9b7fe8" data-path="gimel"/>
      <!-- ダレット: コクマー↔ビナー -->
      <line class="path-line" id="path-dalet" x1="310" y1="130" x2="90" y2="130" stroke="#7bafd4" data-path="dalet"/>
      <!-- ヘー: コクマー↔ティファレト -->
      <line class="path-line" id="path-he" x1="310" y1="130" x2="200" y2="390" stroke="#7bafd4" data-path="he"/>
      <!-- ヴァヴ: コクマー↔ケセド -->
      <line class="path-line" id="path-vav" x1="310" y1="130" x2="310" y2="310" stroke="#7bafd4" data-path="vav"/>
      <!-- ザイン: ビナー↔ティファレト -->
      <line class="path-line" id="path-zayin" x1="90" y1="130" x2="200" y2="390" stroke="#64b5c8" data-path="zayin"/>
      <!-- ヘット: ビナー↔ゲブラー -->
      <line class="path-line" id="path-het" x1="90" y1="130" x2="90" y2="310" stroke="#64b5c8" data-path="het"/>
      <!-- テット: ケセド↔ゲブラー -->
      <line class="path-line" id="path-tet" x1="310" y1="310" x2="90" y2="310" stroke="#8fbc8f" data-path="tet"/>
      <!-- ヨッド: ケセド↔ティファレト -->
      <line class="path-line" id="path-yod" x1="310" y1="310" x2="200" y2="390" stroke="#8fbc8f" data-path="yod"/>
      <!-- カフ: ケセド↔ネツァク -->
      <line class="path-line" id="path-kaf" x1="310" y1="310" x2="310" y2="480" stroke="#8fbc8f" data-path="kaf"/>
      <!-- ラメド: ゲブラー↔ティファレト -->
      <line class="path-line" id="path-lamed" x1="90" y1="310" x2="200" y2="390" stroke="#e08050" data-path="lamed"/>
      <!-- メム: ゲブラー↔ホド -->
      <line class="path-line" id="path-mem" x1="90" y1="310" x2="90" y2="480" stroke="#e08050" data-path="mem"/>
      <!-- ヌン: ティファレト↔ネツァク -->
      <line class="path-line" id="path-nun" x1="200" y1="390" x2="310" y2="480" stroke="#f5c842" data-path="nun"/>
      <!-- サメフ: ティファレト↔イェソド -->
      <line class="path-line" id="path-samech" x1="200" y1="390" x2="200" y2="560" stroke="#f5c842" data-path="samech"/>
      <!-- アイン: ティファレト↔ホド -->
      <line class="path-line" id="path-ayin" x1="200" y1="390" x2="90" y2="480" stroke="#f5c842" data-path="ayin"/>
      <!-- ペー: ネツァク↔ホド -->
      <line class="path-line" id="path-pe" x1="310" y1="480" x2="90" y2="480" stroke="#e879f9" data-path="pe"/>
      <!-- ツァディー: ネツァク↔イェソド -->
      <line class="path-line" id="path-tsadi" x1="310" y1="480" x2="200" y2="560" stroke="#e879f9" data-path="tsadi"/>
      <!-- コフ: ネツァク↔マルクト -->
      <line class="path-line" id="path-qof" x1="310" y1="480" x2="200" y2="650" stroke="#e879f9" data-path="qof"/>
      <!-- レーシュ: ホド↔イェソド -->
      <line class="path-line" id="path-resh" x1="90" y1="480" x2="200" y2="560" stroke="#a0c8e8" data-path="resh"/>
      <!-- シン: ホド↔マルクト -->
      <line class="path-line" id="path-shin" x1="90" y1="480" x2="200" y2="650" stroke="#a0c8e8" data-path="shin"/>
      <!-- タヴ: イェソド↔マルクト -->
      <line class="path-line" id="path-tav" x1="200" y1="560" x2="200" y2="650" stroke="#c0b8e8" data-path="tav"/>

      <!-- ===== セフィロトノード ===== -->
      <!-- ケテル (冥王星) -->
      <g class="sephira" id="node-keter">
        <circle cx="200" cy="40" r="26" fill="#1a1020" stroke="rgba(155,127,232,0.7)" stroke-width="1.5" filter="url(#glow-node)"/>
        <text x="200" y="36" text-anchor="middle" font-size="9" fill="#9b7fe8" letter-spacing="1">冥王星</text>
        <text x="200" y="48" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">ケテル</text>
      </g>
      <!-- コクマー (海王星) -->
      <g class="sephira" id="node-chokmah">
        <circle cx="310" cy="130" r="24" fill="#101820" stroke="rgba(123,175,212,0.7)" stroke-width="1.5" filter="url(#glow-node)"/>
        <text x="310" y="126" text-anchor="middle" font-size="9" fill="#7bafd4" letter-spacing="1">海王星</text>
        <text x="310" y="138" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">コクマー</text>
      </g>
      <!-- ビナー (天王星) -->
      <g class="sephira" id="node-binah">
        <circle cx="90" cy="130" r="24" fill="#101820" stroke="rgba(100,181,200,0.7)" stroke-width="1.5" filter="url(#glow-node)"/>
        <text x="90" y="126" text-anchor="middle" font-size="9" fill="#64b5c8" letter-spacing="1">天王星</text>
        <text x="90" y="138" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">ビナー</text>
      </g>
      <!-- ダアト (土星) — 隠れたセフィラ -->
      <g class="sephira" id="node-daat">
        <circle cx="200" cy="210" r="18" fill="transparent" stroke="rgba(160,150,200,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="200" y="206" text-anchor="middle" font-size="8" fill="rgba(160,150,200,0.4)">土星</text>
        <text x="200" y="217" text-anchor="middle" font-size="7" fill="rgba(160,150,200,0.3)">ダアト</text>
      </g>
      <!-- ケセド (木星) -->
      <g class="sephira" id="node-chesed">
        <circle cx="310" cy="310" r="24" fill="#101810" stroke="rgba(143,188,143,0.7)" stroke-width="1.5" filter="url(#glow-node)"/>
        <text x="310" y="306" text-anchor="middle" font-size="9" fill="#8fbc8f" letter-spacing="1">木星</text>
        <text x="310" y="318" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">ケセド</text>
      </g>
      <!-- ゲブラー (火星) -->
      <g class="sephira" id="node-geburah">
        <circle cx="90" cy="310" r="24" fill="#180e08" stroke="rgba(224,128,80,0.7)" stroke-width="1.5" filter="url(#glow-node)"/>
        <text x="90" y="306" text-anchor="middle" font-size="9" fill="#e08050" letter-spacing="1">火星</text>
        <text x="90" y="318" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">ゲブラー</text>
      </g>
      <!-- ティファレト (太陽) — 中央・一段下 -->
      <g class="sephira" id="node-tiferet">
        <circle cx="200" cy="390" r="28" fill="#181408" stroke="rgba(245,200,66,0.8)" stroke-width="2" filter="url(#glow-keter)"/>
        <text x="200" y="386" text-anchor="middle" font-size="9" fill="#f5c842" letter-spacing="1">太陽</text>
        <text x="200" y="398" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)">ティファレト</text>
      </g>
      <!-- ネツァク (金星) -->
      <g class="sephira" id="node-netzach">
        <circle cx="310" cy="480" r="24" fill="#180818" stroke="rgba(232,121,249,0.7)" stroke-width="1.5" filter="url(#glow-node)"/>
        <text x="310" y="476" text-anchor="middle" font-size="9" fill="#e879f9" letter-spacing="1">金星</text>
        <text x="310" y="488" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">ネツァク</text>
      </g>
      <!-- ホド (水星) -->
      <g class="sephira" id="node-hod">
        <circle cx="90" cy="480" r="24" fill="#081018" stroke="rgba(160,200,232,0.7)" stroke-width="1.5" filter="url(#glow-node)"/>
        <text x="90" y="476" text-anchor="middle" font-size="9" fill="#a0c8e8" letter-spacing="1">水星</text>
        <text x="90" y="488" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">ホド</text>
      </g>
      <!-- イェソド (月) -->
      <g class="sephira" id="node-yesod">
        <circle cx="200" cy="560" r="24" fill="#100e18" stroke="rgba(192,184,232,0.7)" stroke-width="1.5" filter="url(#glow-node)"/>
        <text x="200" y="556" text-anchor="middle" font-size="9" fill="#c0b8e8" letter-spacing="1">月</text>
        <text x="200" y="568" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">イェソド</text>
      </g>
      <!-- マルクト (地球) -->
      <g class="sephira" id="node-malkuth">
        <circle cx="200" cy="650" r="26" fill="#080c08" stroke="rgba(140,180,120,0.6)" stroke-width="1.5" filter="url(#glow-node)"/>
        <text x="200" y="646" text-anchor="middle" font-size="9" fill="#8cb478" letter-spacing="1">地球</text>
        <text x="200" y="658" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">マルクト</text>
      </g>
    </svg>
  </div>

  <!-- 詳細パネル -->
  <div class="detail-panel" id="detail-panel">
    <div class="panel-header">
      <div class="panel-path-name" id="panel-path-name"></div>
      <div class="panel-title" id="panel-title"></div>
      <div class="panel-meta" id="panel-meta"></div>
    </div>
    <div class="panel-body">
      <div class="in-section">
        <div class="section-label">陰転 — 活かせていない状態</div>
        <div class="section-text" id="panel-in"></div>
      </div>
      <div class="yo-section">
        <div class="section-label">陽転 — 活かせている状態</div>

    yo: '感情が消化されて無意識と繋がっているとき、言語化や処理を介さずそのまま体現できる。産声のように意図せず出てくるものが現実に自然に刻まれていく。月の意のまま動くことが十字のように四方に広がり、すべてが揃ったとき世界のカードのように完成として現れる。',
    summary: '意図を介さず体現するとき、月の意が現実に刻まれる。それが完成だ。'
  }
};

const PATH_ORDER = ['alef','bet','gimel','dalet','he','vav','zayin','het','tet','yod','kaf','lamed','mem','nun','samech','ayin','pe','tsadi','qof','resh','shin','tav'];

let activePathId = null;

function openPath(pathId) {
  if (!PATHS[pathId]) return;
  const p = PATHS[pathId];

  // アクティブ状態
  if (activePathId) {
    const prev = document.getElementById('path-' + activePathId);
    if (prev) prev.classList.remove('active');
    const prevCard = document.querySelector('.path-card[data-path="' + activePathId + '"]');
    if (prevCard) prevCard.classList.remove('active');
  }
  activePathId = pathId;
  const line = document.getElementById('path-' + pathId);
  if (line) line.classList.add('active');
  const card = document.querySelector('.path-card[data-path="' + pathId + '"]');
  if (card) {
    card.classList.add('active');
    card.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  // パネル更新
  document.getElementById('panel-path-name').textContent = p.name + ' — ' + p.hebrew;
  document.getElementById('panel-title').textContent = p.planets;
  document.getElementById('panel-meta').innerHTML = `
    <span class="meta-tag meta-planet">${p.planets}</span>
    <span class="meta-tag meta-hebrew">原義：${p.hebrew}</span>
    <span class="meta-tag meta-tarot">${p.tarot}</span>
  `;
  document.getElementById('panel-in').textContent = p.in;
  document.getElementById('panel-yo').textContent = p.yo;
  document.getElementById('panel-summary').textContent = p.summary;

  const panel = document.getElementById('detail-panel');
  panel.classList.add('show');
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('show');
  if (activePathId) {
    const line = document.getElementById('path-' + activePathId);
    if (line) line.classList.remove('active');
    const card = document.querySelector('.path-card[data-path="' + activePathId + '"]');
    if (card) card.classList.remove('active');
    activePathId = null;
  }
}

// パスラインにクリックイベントを追加
document.querySelectorAll('.path-line').forEach(line => {
  line.addEventListener('click', function() {
    openPath(this.dataset.path);
  });
});

// パス一覧を生成
const listEl = document.getElementById('path-list');
PATH_ORDER.forEach(id => {
  const p = PATHS[id];
  const card = document.createElement('div');
  card.className = 'path-card';
  card.dataset.path = id;
  card.innerHTML = `
    <div class="pc-name" style="color:${p.color}">${p.name} — ${p.hebrew}</div>
    <div class="pc-title">${p.planets}</div>
    <div class="pc-meta">${p.tarot}</div>
  `;
  card.addEventListener('click', () => openPath(id));
  listEl.appendChild(card);
});
</script>
</body>
</html>
