.bg-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(10,10,15,0.35) 80%, rgba(10,10,15,0.7) 100%), linear-gradient(to bottom, rgba(10,10,15,0.5) 0%, transparent 18%, transparent 70%, rgba(10,10,15,0.4) 100%); z-index: 1; }
.inner-frame { position: absolute; inset: 12px; border: 1px solid rgba(245,200,66,0.5); border-radius: 10px; pointer-events: none; z-index: 5; }
.inner-frame::before, .inner-frame::after { content: '✦'; position: absolute; color: var(--gold); font-size: 12px; background: rgba(10,10,15,0.6); padding: 0 6px; }
.inner-frame::before { top: -8px; left: 20px; }
.inner-frame::after { bottom: -8px; right: 20px; }

.no-badge { position: absolute; top: 32px; left: 32px; z-index: 10; text-align: center; }
.no-badge-label { font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: .3em; color: var(--gold); opacity: 0.9; text-shadow: 0 2px 6px rgba(0,0,0,0.95); }
.no-badge-num { font-family: 'Cinzel', serif; font-size: 48px; font-weight: 600; background: linear-gradient(135deg, #f5c842, #e879f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.95)); margin-top: 2px; }
.no-badge-name { font-size: 16px; color: var(--text); letter-spacing: .15em; margin-top: 4px; font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,1); }

.type-badge { position: absolute; top: 32px; right: 32px; z-index: 10; background: rgba(10,10,15,0.7); backdrop-filter: blur(6px); border: 1px solid rgba(200,164,86,0.6); border-radius: 8px; padding: 10px 14px; text-align: center; box-shadow: 0 0 20px rgba(200,164,86,0.3); }
.type-badge-label { font-family: 'Cinzel', serif; font-size: 7px; letter-spacing: .3em; color: var(--gold); opacity: 0.8; margin-bottom: 4px; }
.type-badge-name { font-size: 22px; font-weight: 700; color: var(--tsuchi); letter-spacing: .08em; line-height: 1; }
.type-badge-en { font-size: 11px; letter-spacing: .15em; color: var(--text); margin-top: 5px; font-weight: 600; }

.catch { position: absolute; top: 360px; left: 0; right: 0; text-align: center; font-size: 16px; color: #fff; letter-spacing: .12em; z-index: 10; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,1), 0 0 6px rgba(0,0,0,1); }

.radar-box { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); width: 280px; height: 250px; background: rgba(10,10,15,0.85); border: 1px solid rgba(245,200,66,0.4); border-radius: 10px; padding: 18px 6px 6px; z-index: 10; box-shadow: 0 0 25px rgba(0,0,0,0.5); }
.status-label { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: .35em; color: var(--gold); opacity: 0.9; text-transform: uppercase; }

.btn-row { display: flex; gap: 12px; width: 600px; }
.btn { flex: 1; padding: 14px; background: #111118; border: 1px solid rgba(167,139,250,0.3); border-radius: 10px; color: var(--accent); font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: .2em; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
.btn:hover { background: rgba(167,139,250,0.1); border-color: var(--accent); }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none; }
.btn-primary:hover { opacity: 0.9; }
</style>

  <button class="btn btn-primary" onclick="saveCard()">📥 画像として保存</button>

<script>
async function saveCard() {
  const card = document.getElementById('cardEl');
  try {
    const canvas = await html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true, logging: false });
    const link = document.createElement('a');
    link.download = '魂のトリセツ_No17_闘士.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) { alert('保存に失敗しました: ' + e.message); }
}
async function shareCard() {
  const card = document.getElementById('cardEl');
  try {
    const canvas = await html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true, logging: false });
    canvas.toBlob(async (blob) => {
      const file = new File([blob], '魂のトリセツ.png', {type: 'image/png'});
      if (navigator.share && navigator.canShare && navigator.canShare({files: [file]})) {
        await navigator.share({ files: [file], title: '魂のトリセツ - No.17 闘士', text: '私の魂のトリセツ・超数秘術' });
      } else {
        const link = document.createElement('a');
        link.download = '魂のトリセツ_No17_闘士.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        alert('お使いの環境ではシェア機能が使えません。画像を保存しました。');
      }
    });
  } catch(e) { alert('シェアに失敗しました: ' + e.message); }
}
</script>
