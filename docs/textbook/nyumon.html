<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>超数秘術 入門</title>

<style>
:root{
  --bg:#0b0a12;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Shippori Mincho B1',serif;
  line-height:2.05;
  letter-spacing:.05em;
  font-size:15.5px;
  overflow:hidden;
}
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.35) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 55% 45%, rgba(200,180,255,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 72%, rgba(255,255,255,.3) 50%, transparent 51%),

    radial-gradient(1.5px 1.5px at 8% 88%, rgba(255,255,255,.25) 50%, transparent 51%),
    radial-gradient(1px 1px at 65% 85%, rgba(255,255,255,.3) 50%, transparent 51%);
}
#book{
  position:relative;z-index:1;
  height:100%;
  max-width:640px;
  margin:0 auto;
  display:flex;flex-direction:column;
}
#stage{
  flex:1;min-height:0;
  position:relative;
  overflow:hidden;
}
.pg{
  position:absolute;inset:0;
  padding:54px 32px 24px;
  overflow-y:auto;
  opacity:0;pointer-events:none;
  transform:translateX(24px);
  transition:opacity .35s ease, transform .35s ease;
  display:flex;flex-direction:column;justify-content:flex-start;
}
.pg.center{justify-content:center;text-align:center;}
.pg.on{opacity:1;pointer-events:auto;transform:translateX(0);}
.pg.off-l{transform:translateX(-24px);}
/* ナビ */
#nav{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 26px 20px;
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:.2em;
  color:var(--ink-dim);
  user-select:none;
}
.nav-btn{
  cursor:pointer;padding:8px 18px;
  border:1px solid var(--line);
  color:var(--ink-soft);
  transition:all .2s;
}
.nav-btn:hover{background:rgba(167,139,250,.12);color:#fff}
.nav-btn.dis{opacity:.25;pointer-events:none}
#chap{position:fixed;top:18px;left:0;right:0;text-align:center;z-index:2;
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:.45em;color:var(--accent);opacity:.7;}
/* パーツ */
.knum{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.5em;color:var(--accent);opacity:.85;margin-bottom:14px;}
h1{font-size:24px;font-weight:700;letter-spacing:.14em;margin-bottom:30px;padding-bottom:16px;border-bottom:1px solid var(--line);}
h2{font-size:17px;font-weight:600;letter-spacing:.1em;color:var(--accent);margin-bottom:20px;}
p{margin-bottom:1.7em;}
.soft{color:var(--ink-soft)}
strong{color:var(--gold);font-weight:600}
em{font-style:normal;color:var(--accent)}
.q{margin:1.8em 0;padding:2px 0 2px 20px;border-left:2px solid var(--line);color:var(--ink-soft);font-size:14.5px;}
.big{font-size:21px;line-height:2.5;letter-spacing:.12em;}
.try{
  margin-top:auto;
  border:1px solid var(--line);
  padding:18px 20px;
  font-size:14px;color:var(--ink-soft);
  background:rgba(167,139,250,.05);
}
.try b{display:block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.4em;color:var(--accent);margin-bottom:8px;font-weight:400;}
/* 表紙 */
.cover-en{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.6em;color:var(--accent);opacity:.8;margin-bottom:24px;}
.cover-title{font-size:42px;font-weight:700;letter-spacing:.3em;text-indent:.3em;margin-bottom:8px;}
.cover-sub{font-size:19px;letter-spacing:.5em;color:var(--gold);text-indent:.5em;margin-bottom:42px;}
.cover-line{width:1px;height:60px;background:linear-gradient(to bottom,var(--accent),transparent);margin:0 auto 38px;}
/* 図鑑 */
.zk{border-bottom:1px solid rgba(167,139,250,.14);padding:16px 2px;}
.zk:last-of-type{border-bottom:none}
.zk-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;}
.zk-no{font-family:'Cinzel',serif;font-size:11px;color:var(--accent);opacity:.8;min-width:22px;}
.zk-name{font-size:18px;font-weight:700;letter-spacing:.16em;}
.zk-desc{font-size:13.5px;color:var(--gold);margin-bottom:4px;letter-spacing:.04em;}
.zk-tr{font-size:12.5px;color:var(--ink-dim);line-height:1.9;}
/* ステージ表 */
.stg{border:1px solid var(--line);padding:14px 18px;margin-bottom:14px;}
.stg b{color:var(--accent);font-weight:600;letter-spacing:.08em;display:block;margin-bottom:4px;font-size:14px;}
.stg span{font-size:13px;color:var(--ink-soft);}
.stg i{font-style:normal;color:var(--gold);font-size:12px;}
@media(max-width:480px){
  .cover-title{font-size:32px}
  body{font-size:14.5px}
  .pg{padding:50px 22px 20px}
}
</style>
</head>
<body>

<h1>さあ、何を生み出しますか</h1>
<p>ここまでが、超数秘術の地図です。</p>
<p>これは新しい時代のパッケージです。古い知恵——数、名前、樹、星——を、いまを生きる人が実際に使える一枚に組み直したもの。</p>
<p>そして、名前から読むというこの体系の入口には、意味があります。あなたの名前は、あなたが一人で作ったものではありません。誰かが想いを込めてつけ、無数の人に呼ばれて、響いてきたものです。</p>
<p>その名前に地図が刻まれているということは、あなたが最初から、<strong>ご縁の世界の一員</strong>だったということです。一人で生きているようで、一人ではなかったということです。</p>`);

pg('終章', `
<p style="margin-top:10vh;">地図を手にした人の人生は、占いに従う人生ではありません。</p>
<p>本来の顔で生き、揺れから降り、湧いてくるものと共に進む——それは、人生を<strong>創造するもの</strong>として生きるということです。</p>
<p>創造とは、その人でなければ生まれなかったもののことです。誰かにできることなら、あなたでなくてもいい。あなたから生まれて、でもあなただけのものでもない——そういう何かが、名前の中で出番を待っています。</p>
<p>道具は渡しました。地図はあなたの手の中にあります。</p>
<p class="big" style="text-align:center;margin-top:56px;">さあ、あなたは<br>何を生み出していきますか。</p>`,1);

/* ===== 描画 ===== */
const stage=document.getElementById('stage');
P.forEach((p,i)=>{
  const d=document.createElement('div');
  d.className='pg'+(p.center?' center':'');
  d.innerHTML=p.h;
  stage.appendChild(d);
});
const pages=[...stage.children];
let cur=0;
const pos=document.getElementById('pos'),chap=document.getElementById('chap');
const prev=document.getElementById('prev'),next=document.getElementById('next');
function show(n){
  n=Math.max(0,Math.min(P.length-1,n));
  pages.forEach((el,i)=>{
    el.classList.toggle('on',i===n);
    el.classList.toggle('off-l',i<n);
  });
  cur=n;
  pos.textContent=(n+1)+' / '+P.length;
  chap.textContent=P[n].c;
  prev.classList.toggle('dis',n===0);
  next.classList.toggle('dis',n===P.length-1);
  pages[n].scrollTop=0;
  try{history.replaceState(null,'','#'+(n+1));}catch(e){}
}
prev.onclick=()=>show(cur-1);
next.onclick=()=>show(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')show(cur+1);
  if(e.key==='ArrowLeft')show(cur-1);
});
let tx=null;
stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>60) show(cur+(dx<0?1:-1));
  tx=null;
},{passive:true});
const h=parseInt((location.hash||'').slice(1));
show(isNaN(h)?0:h-1);
</script>
</body>
